services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: flask_app
    ports:
      - "5000:5000"
    environment:
      # Demo Locust is launched inside this container, so it must call its own
      # Flask listener rather than another container's localhost.
      FLASK_HOST_URL: http://127.0.0.1:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - monitoring_net

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus/Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
    depends_on:
      app:
        condition: service_healthy

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_net
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana

  alertmanager:
    build:
      context: .
      dockerfile: docker/alertmanager/Dockerfile
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring_net

  ml_service:
    build:
      context: .
      dockerfile: docker/ml_service/Dockerfile
    container_name: ml_service
    ports:
      - "5001:5001"
    environment:
      APP_METRICS_URL: http://app:5000/metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - monitoring_net
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: react_frontend
    ports:
      - "5173:80"
    networks:
      - monitoring_net
    depends_on:
      app:
        condition: service_healthy
      ml_service:
        condition: service_healthy

  locust:
    build:
      context: .
      dockerfile: docker/locust/Dockerfile
    container_name: locust
    ports:
      - "8089:8089"
    networks:
      - monitoring_net
    depends_on:
      app:
        condition: service_healthy

networks:
  monitoring_net:
    driver: bridge

volumes:
  grafana_data:
