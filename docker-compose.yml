services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: flask_app
    ports:
      - "5000:5000"
    networks:
      - monitoring_net

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus/Dockerfile
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
    depends_on:
      - app

  grafana:
    build:
      context: .
      dockerfile: docker/grafana/Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_net
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  alertmanager:
    build:
      context: .
      dockerfile: docker/alertmanager/Dockerfile
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring_net

  locust:
    build:
      context: .
      dockerfile: docker/locust/Dockerfile
    container_name: locust
    ports:
      - "8089:8089"

  ml_service:
    build:
      context: .
      dockerfile: docker/ml_service/Dockerfile
    container_name: ml_service
    ports:
      - "5001:5001"
    networks:
      - monitoring_net
    depends_on:
      - app

networks:
  monitoring_net:
    driver: bridge

volumes:
  grafana_data: