global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "D:/containerized-monitoring-system/monitoring/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"


scrape_configs:
  - job_name: "flask_app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "localhost:5000"
