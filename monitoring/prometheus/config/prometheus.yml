global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"


scrape_configs:
  - job_name: "flask_app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:5000"
