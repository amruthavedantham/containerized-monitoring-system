server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy demo and realtime metrics endpoints to Flask backend
    location /api/ {
        proxy_pass http://app:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy standard test endpoints to Flask backend
    location /health {
        proxy_pass http://app:5000/health;
        proxy_set_header Host $host;
    }

    location /process {
        proxy_pass http://app:5000/process;
        proxy_set_header Host $host;
    }

    location /slow {
        proxy_pass http://app:5000/slow;
        proxy_set_header Host $host;
    }

    location /error {
        proxy_pass http://app:5000/error;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://app:5000/metrics;
        proxy_set_header Host $host;
    }

    # Proxy ML Service predict endpoint
    location /predict {
        proxy_pass http://ml_service:5001/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ml/ {
        proxy_pass http://ml_service:5001/;
        proxy_set_header Host $host;
    }
}
