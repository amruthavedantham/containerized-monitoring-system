<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Control Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 { margin: 0 0 0.5rem 0; font-size: 1.75rem; color: #fff; }
        p { margin: 0; color: var(--text-muted); }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; }
        }

        .endpoint-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .endpoint-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: left;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .endpoint-btn:hover {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .endpoint-name {
            font-weight: 600;
            display: block;
            margin-bottom: 0.25rem;
        }

        .endpoint-path {
            font-family: monospace;
            background: #0f172a;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .viewer-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            overflow: hidden;
        }

        .viewer-header {
            background-color: rgba(15, 23, 42, 0.5);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
        }

        .viewer-body {
            padding: 1.5rem;
            flex-grow: 1;
            position: relative;
            overflow-x: auto;
        }

        pre {
            margin: 0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            display: none;
        }

        .status-code {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-200 { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-500 { background: rgba(239, 68, 68, 0.1); color: var(--error); }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>API Control Panel</h1>
                <p>Welcome to the unified developer dashboard for your Flask Backend.</p>
            </div>
            <div class="status-badge" id="backend-status">
                <div class="status-dot"></div> Backend: Online
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="endpoint-list">
                <h3 style="margin-top: 0; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Available Endpoints</h3>
                
                <button class="endpoint-btn" onclick="fetchEndpoint('/health')">
                    <span class="endpoint-name">Health Check <span class="endpoint-path">/health</span></span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Verifies if the API is running correctly.</span>
                </button>

                <button class="endpoint-btn" onclick="fetchEndpoint('/process')">
                    <span class="endpoint-name">Process Data <span class="endpoint-path">/process</span></span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Simulates a short data processing task.</span>
                </button>

                <button class="endpoint-btn" onclick="fetchEndpoint('/slow')">
                    <span class="endpoint-name">Slow Response <span class="endpoint-path">/slow</span></span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Simulates a delayed response (2s).</span>
                </button>

                <button class="endpoint-btn" onclick="fetchEndpoint('/error')">
                    <span class="endpoint-name">Intentional Error <span class="endpoint-path">/error</span></span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Triggers a deliberate 500 server error.</span>
                </button>

                <button class="endpoint-btn" onclick="fetchEndpoint('/metrics')">
                    <span class="endpoint-name">Prometheus Metrics <span class="endpoint-path">/metrics</span></span>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Fetches raw Prometheus monitoring metrics.</span>
                </button>
            </div>

            <div class="viewer-panel">
                <div class="viewer-header">
                    <span id="request-url" style="color: var(--text-muted);">Select an endpoint to test</span>
                    <span id="status-code" class="status-code" style="display: none;"></span>
                </div>
                <div class="viewer-body">
                    <div id="loading" class="loading">Fetching response...</div>
                    <pre id="response-output"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchEndpoint(path) {
            const output = document.getElementById('response-output');
            const loading = document.getElementById('loading');
            const reqUrl = document.getElementById('request-url');
            const statusCodeElem = document.getElementById('status-code');
            
            output.textContent = '';
            statusCodeElem.style.display = 'none';
            reqUrl.textContent = `GET ${path}`;
            reqUrl.style.color = '#fff';
            loading.style.display = 'block';

            try {
                const response = await fetch(path);
                const contentType = response.headers.get("content-type");
                
                statusCodeElem.textContent = response.status;
                statusCodeElem.className = `status-code status-${response.status >= 500 ? '500' : '200'}`;
                statusCodeElem.style.display = 'block';

                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await response.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } else {
                    const text = await response.text();
                    output.textContent = text;
                }
            } catch (error) {
                output.textContent = 'Error fetching endpoint: ' + error.message;
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
